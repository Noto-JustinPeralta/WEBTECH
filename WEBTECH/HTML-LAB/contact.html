<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>
<body>
    <form action="contact.html" method="GET">
        <label for="fname">First Name</label>
        <p><input type="text" id="fname" name="fname"></p>
        <label for="lname">Last Name</label>
        <p><input type="text" id="lname" name="lname"></p>
        <label for="mname">Middle Name</label>
        <p><input type="text" id="mname" name="mname"></p>

    
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>
        <label for="pwd">Password:</label>
        <input type="password" id="pwd" name="pwd" minlength="8"><br><br>

        <p>
        <label for="comments">Message</label><br>
        <textarea id="comments" name="comments" rows="4" cols="30"></textarea>
        </p>

        <p>Subject:</p>
        <select id="subject" name="subject">
            <option value="">-- Select Subject --</option>
            <option value="BSCS">Math 100</option>
            <option value="BSIT">Science 101</option>
            <option value="BSBA">WEB TECHNOLOGIES</option>
            <option value="BSED">Quantitative Analysis</option>
            <option value="Other">Other</option>
        </select>
        
        <p>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
        </p>
</body>
</html>
