<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body>

<h2>Registration Form</h2>
    <form action="registration.html" method="GET">
        <label for="fname">First Name</label>
        <p><input type="text" id="fname" name="fname"></p>
        <label for="lname">Last Name</label>
        <p><input type="text" id="lname" name="lname"></p>
        <label for="mname">Middle Name</label>
        <p><input type="text" id="mname" name="mname"></p>

    
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>
        <label for="pwd">Password:</label>
        <input type="password" id="pwd" name="pwd" minlength="8"><br><br>

        <label for="birthday">Birthday:</label>
        <input type="date" id="birthday" name="birthday">
        
        <p>Gender:</p>
        <input type="checkbox" id="G1" name="G1"
        value="Male">
        <label for="G1">Male</label>
        <p>
            <input type="checkbox" id="G2" name="G2"
            value="Female">
            <label for="G2">Female</label>
        </p>
        <label for="OtherG">Other:</label>
        <input type="text" id="OtherG" name="OtherG">
        
    </form>
</body>
</html>
